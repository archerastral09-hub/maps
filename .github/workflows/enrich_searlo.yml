# À placer dans : .github/workflows/enrich_searlo.yml
# Secret requis : SEARLO_API_KEYS  (les 21 clés, une par ligne)
# Entrée requise : data/agences_nettoyees.csv  (colonnes Nom;Adresse;Numéro de page)
name: Enrichissement Searlo

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Limite de requêtes pour ce run (0 = illimité, ex. 20 pour un test)"
        default: "0"
      retry_errors:
        description: "Retenter aussi les agences abandonnées après trop d'échecs"
        type: boolean
        default: false
      chain:
        description: "Se relancer automatiquement tant qu'il reste des agences"
        type: boolean
        default: true

# un seul run à la fois (les relances s'enchaînent sans se chevaucher)
concurrency:
  group: enrich-searlo
  cancel-in-progress: false

permissions:
  contents: write   # pousser data/
  actions: write    # se relancer

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Identité git
        run: |
          git config user.name  "searlo-bot"
          git config user.email "searlo-bot@users.noreply.github.com"

      - name: Enrichissement
        env:
          SEARLO_API_KEYS: ${{ secrets.SEARLO_API_KEYS }}
          INPUT_FILE: data/agences_nettoyees.csv
          MAX_RUNTIME_MIN: "330"        # arrêt propre bien avant la limite de 6 h
          GIT_CHECKPOINT: "1"           # commit + push intermédiaire (toutes les 45 min)
          MAX_REQUESTS: ${{ inputs.max_requests }}
          RETRY_ERRORS: ${{ inputs.retry_errors }}
        run: python enrich_searlo.py

      # S'exécute même si le script a planté ou si le job est annulé : on ne perd rien
      - name: Sauvegarde finale de data/
        if: always()
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Rien à sauvegarder"
          else
            git commit -m "data: sauvegarde finale $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git push && break
              git pull --rebase --autostash
            done
          fi

      - name: Logs en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-searlo-${{ github.run_id }}
          path: |
            data/logs/
            data/erreurs.jsonl
            data/state.json
          if-no-files-found: ignore
          retention-days: 30

      # Relance seulement si le run s'est arrêté à cause de la durée max et qu'il reste du travail
      - name: Relance automatique
        if: ${{ success() && inputs.chain != false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read OUTCOME TRAITEES RESTANTES < <(python - <<'PY'
          import json
          s = json.load(open("data/state.json")).get("last_summary", {})
          print(("DUREE" if s.get("outcome", "").startswith("arrêt demandé") else "AUTRE"),
                s.get("traitees", 0), s.get("restantes", 0))
          PY
          )
          echo "outcome=$OUTCOME traitees=$TRAITEES restantes=$RESTANTES"
          if [ "$OUTCOME" = "DUREE" ] && [ "$TRAITEES" -gt 0 ] && [ "$RESTANTES" -gt 0 ]; then
            gh workflow run enrich_searlo.yml --ref "${{ github.ref_name }}" \
              -f max_requests=0 -f retry_errors=false -f chain=true
            echo "Relance déclenchée"
          else
            echo "Pas de relance"
          fi
